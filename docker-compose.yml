services:
  cache:
    image: valkey/valkey:9.1.1
    volumes:
    - redis-data:/data
    command: [valkey-server, --save, '60', '1', --loglevel, warning]
    restart: always
    read_only: true
  database:
    image: postgres:18-alpine
    volumes:
    - postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: weblate
      POSTGRES_USER: weblate
      POSTGRES_DB: weblate
    restart: always
  weblate:
    # Pinned to 5.4.x: openstack/i18n gerrit 961371's
    # tools/migration/language/{create_languages_weblate,delete_languages}.py
    # hard-check WEBLATE_SUPPORTED_VERSION == "5.4" in WeblateRestService.__init__
    # and refuse to run against any other version.
    image: weblate/weblate:5.4.3.2
    depends_on:
    - cache
    - database
    ports:
    - "8080:8080"
    volumes:
    - weblate-data:/app/data
    - weblate-cache:/app/cache
    - ./settings-override.py:/app/data/settings-override.py:ro
    environment:
      WEBLATE_SITE_DOMAIN: localhost:8080
      WEBLATE_SITE_TITLE: Weblate
      WEBLATE_ADMIN_NAME: Weblate Admin
      WEBLATE_ADMIN_EMAIL: weblate@example.com
      WEBLATE_SERVER_EMAIL: weblate@example.com
      WEBLATE_DEFAULT_FROM_EMAIL: weblate@example.com
      WEBLATE_ALLOWED_HOSTS: "*"
      WEBLATE_REGISTRATION_OPEN: "1"
      POSTGRES_PASSWORD: weblate
      POSTGRES_USER: weblate
      POSTGRES_DB: weblate
      # Needed for Weblate 5.4.x and older containers (this one is pinned
      # to 5.4.3.2 -- see the image comment above).
      POSTGRES_DATABASE: weblate
      POSTGRES_HOST: database
      REDIS_HOST: cache
      REDIS_PORT: 6379
    restart: always
    read_only: true
    tmpfs:
    - /run
    - /tmp
volumes:
  weblate-cache: {}
  weblate-data: {}
  postgres-data: {}
  redis-data: {}
