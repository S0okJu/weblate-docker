[tox]
skipsdist = true
envlist = save-token

[testenv]
skip_install = true
setenv =
    TOKEN_FILE = {toxinidir}/.weblate-token
    WEBLATE_URL = http://localhost:8080/
    WEBLATE_INI = {toxinidir}/i18n/tools/migration/language/weblate.ini
    PYTHONPATH = {toxinidir}/i18n/tools

[testenv:docker-up]
description =
    Start the local Weblate test environment (docker compose up -d) and
    wait until it responds on :8080.
allowlist_externals =
    docker
    bash
changedir = {toxinidir}/docker-compose
commands =
    docker compose up -d {posargs}
    bash -c 'echo -n "Waiting for Weblate on :8080"; \
        for i in $(seq 1 60); do \
            if curl -sf -o /dev/null http://localhost:8080/; then echo " up"; exit 0; fi; \
            echo -n "."; sleep 2; \
        done; \
        echo " timeout"; exit 1'

[testenv:docker-down]
description =
    Stop the local Weblate test environment. Pass -- -v via posargs to
    also remove volumes (wipes the database and all languages/data).
allowlist_externals = docker
changedir = {toxinidir}/docker-compose
commands =
    docker compose down {posargs}

[testenv:docker-logs]
description =
    Follow weblate container logs (Ctrl-C to stop).
allowlist_externals = docker
changedir = {toxinidir}/docker-compose
commands =
    docker compose logs -f {posargs:weblate}

[testenv:docker-password]
description =
    Best-effort scan of weblate logs for the auto-generated initial admin
    password (only printed on the very first boot, since WEBLATE_ADMIN_PASSWORD
    is left unset in docker-compose.override.yml).
allowlist_externals =
    docker
    bash
changedir = {toxinidir}/docker-compose
commands =
    bash -c 'docker compose logs weblate | grep -i password \
        || echo "No password lines found (already initialized earlier, or already retrieved)."'

[testenv:fetch-i18n]
description =
    Clone openstack/i18n into i18n/ (if not already present) and check out
    gerrit change 961371 via git-review. git-review is installed into this
    tox env's own venv, so only the `git` binary itself needs to be on the
    system (git-review can't replace that, it shells out to it).
skip_install = true
allowlist_externals =
    git
    bash
deps =
    git-review
commands =
    bash -c 'test -d "{toxinidir}/i18n/.git" || \
        git clone https://opendev.org/openstack/i18n.git "{toxinidir}/i18n"'
    bash -c 'cd "{toxinidir}/i18n" && git review -s && git review -d 961371'

[testenv:save-token]
description =
    Save a Weblate API token to .weblate-token for reuse by delete-language
    and create-language. Generate the token first via the Weblate UI:
    user menu (top right) -> API access -> Add new token. You will be
    prompted to paste it (hidden input) -- do not pass it as a tox argument,
    it would leak into tox's command echo / shell history.
commands =
    python {toxinidir}/scripts/save_token.py

[testenv:delete-language]
description =
    Run openstack/i18n's delete_languages.py against the local Weblate
    instance. Dry-run by default; pass --apply via posargs to actually
    delete. Requires: tox -e save-token -- <TOKEN>
deps =
    requests>=2.18.4
    wlc
commands =
    python {toxinidir}/scripts/gen_weblate_ini.py
    python {toxinidir}/i18n/tools/migration/language/delete_languages.py \
        --ini {env:WEBLATE_INI} {posargs}

[testenv:create-language]
description =
    Run openstack/i18n's create_languages_weblate.py against the local
    Weblate instance, using the zanata-plural.json / zanata.json fixtures
    shipped with the patch. Dry-run by default; pass --apply via posargs.
    Requires: tox -e save-token -- <TOKEN>
deps =
    requests>=2.18.4
    wlc
commands =
    python {toxinidir}/scripts/gen_weblate_ini.py
    python {toxinidir}/i18n/tools/migration/language/create_languages_weblate.py \
        -i {toxinidir}/i18n/tools/migration/language/zanata-plural.json \
        -z {toxinidir}/i18n/tools/migration/language/zanata.json \
        --ini {env:WEBLATE_INI} {posargs}
